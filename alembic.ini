[alembic]
script_location = %(here)s/src/patchwatch/db/migrations
prepend_sys_path = %(here)s/src
file_template = %%(rev)s_%%(slug)s
timezone = UTC
# Fallback URL — env.py overrides this from pydantic-settings (Settings.database_url).
sqlalchemy.url = postgresql+psycopg://patchwatch:patchwatch@localhost:5432/patchwatch

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S