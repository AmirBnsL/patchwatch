services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: patchwatch
      POSTGRES_PASSWORD: patchwatch
      POSTGRES_DB: patchwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchwatch -d patchwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://patchwatch:patchwatch@postgres:5432/patchwatch
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "patchwatch", "monitor", "--source", "fixture"]

volumes:
  pgdata: